name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows
        run: >
          dotnet publish Windows/DynamicIsland.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/windows

      - name: Zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path publish/windows/* -DestinationPath "Windows-Dynamic-Island-$ver.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Windows-Dynamic-Island-*.zip

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Resolve version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stage ASCII assets
        run: |
          cp "Downloads/Mac灵动岛_M芯片_${RELEASE_VERSION}.pkg" "Mac-Dynamic-Island-${RELEASE_VERSION}.pkg"
          cp "Downloads/Mac灵动岛_intel_${RELEASE_VERSION}.pkg" "Mac-Dynamic-Island-${RELEASE_VERSION}-intel.pkg"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "灵动岛 ${{ github.ref_name }}"
          tag_name: "${{ github.ref_name }}"
          body_path: "Docs/releases/${{ github.ref_name }}.md"
          files: |
            Mac-Dynamic-Island-${{ env.RELEASE_VERSION }}.pkg
            Mac-Dynamic-Island-${{ env.RELEASE_VERSION }}-intel.pkg
            Windows-Dynamic-Island-${{ env.RELEASE_VERSION }}.zip
